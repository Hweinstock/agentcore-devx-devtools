name: Mint GitHub App token
description: >
  Assume the dedicated token-minting role, read the isolated GitHub App
  private key, and return a short-lived installation token.

inputs:
  role-arn:
    description: ARN of the dedicated GitHub App token-minting role.
    required: true

outputs:
  token:
    description: Short-lived GitHub App installation token.
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Register role ARN mask
      shell: bash
      run: echo "::add-mask::${{ inputs.role-arn }}"

    - name: Configure token-minting credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1
        mask-aws-account-id: true
        output-env-credentials: false
        output-credentials: true

    - name: Read GitHub App private key
      id: private-key
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
      run: |
        set -euo pipefail

        private_key="$(
          aws secretsmanager get-secret-value \
            --region us-east-1 \
            --secret-id APP_PRIVATE_KEY \
            --query SecretString \
            --output text
        )"
        if [[ -z "$private_key" ]]; then
          echo "::error::APP_PRIVATE_KEY is empty."
          exit 1
        fi

        while IFS= read -r line; do
          [[ -n "$line" ]] && echo "::add-mask::$line"
        done <<< "$private_key"

        delimiter="APP_PRIVATE_KEY_${RANDOM}_${RANDOM}"
        {
          echo "value<<$delimiter"
          printf '%s\n' "$private_key"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
        unset private_key

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: "3637953"
        private-key: ${{ steps.private-key.outputs.value }}
