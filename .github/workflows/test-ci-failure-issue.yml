# TEST reusable workflow: ci-failure-issue — MIRRORS reusable-ci-failure-issue.yml as
# faithfully as possible. The workflow_run event parse (the conclusion/head_branch gate),
# job concurrency key, checkout, Node setup, App-token mint, and
# the issue-body input computation (env vars from github.event.workflow_run.*) all run
# for real. The ONLY stubbed action is the outward issue creation — the
# `npx tsx create-failure-issue.ts` invocation is replaced with an echo.
# Safe to fire on a push to feat/caller-workflows.

name: "TEST - CI Failure Issue"

# caller-on:
#   push:
#     branches:
#     - feat/caller-workflows
#   workflow_run:
#     workflows:
#     - Build and Test
#     - Quality and Safety Checks
#     - E2E Tests (Full Suite)
#     - CodeQL
#     types:
#     - completed

on:
  workflow_call:
    # No inputs required (see header for how repo-specific values are derived).

jobs:
  create-issue:
    # Keyed on the failing workflow name so concurrent failures of different
    # workflows don't cancel each other, but repeated runs for the same workflow
    # collapse. github.event.workflow_run.* is inherited from the caller's
    # triggering workflow_run event.
    concurrency: ci-failure-issue-${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only act when the upstream CI workflow actually FAILED on the main branch.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    permissions:
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Generate GitHub App Token
        id: app-token
        uses: aws/agentcore-devx-devtools/.github/actions/mint-github-app-token@31aa3b031a86664e29861d68956e44b07cf21a74
        with:
          role-arn: ${{ secrets.GITHUB_APP_TOKEN_MINTING_ROLE_ARN }}

      # STUB: the real workflow runs `npx tsx .github/scripts/create-failure-issue.ts`,
      # which OPENS a GitHub issue on the caller repo. Outward + creates a persistent
      # issue — stubbed here. The event parse, token, and body inputs (env below) are
      # all real; only the issue-creating invocation is replaced with an echo.
      - name: Create CI failure issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "ℹ️  (stub) would: npx -y tsx .github/scripts/create-failure-issue.ts \\"
          echo "ℹ️  (stub)   --title-prefix 'CI Failure' --name '$WORKFLOW_NAME' \\"
          echo "ℹ️  (stub)   --branch '$HEAD_BRANCH' --commit '$HEAD_SHA' \\"
          echo "ℹ️  (stub)   --run-url '$RUN_URL' --labels 'high-severity,ci'"
