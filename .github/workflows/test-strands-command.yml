# TEST reusable workflow: strands-command (pair of reusable-strands-command.yml)
#
# Mirrors the reusable: the /strands (or dispatch) gate, secret fetch, the collaborator
# authorization check, checkout, the command-parsing / prompt-construction step
# (process-inputs.cjs), and the App-token mint all run VERBATIM. STUBBED: the
# add/remove of the `strands-running` label (label mutation) and the "Run Strands
# Agent" composite (which runs the agent and posts PR comments/reviews). Safe on a
# dev branch.
name: "TEST - Strands Command"

# caller-on:
#   push:
#     branches:
#     - feat/caller-workflows
#   issue_comment:
#     types:
#     - created
#   pull_request_review_comment:
#     types:
#     - created
#   workflow_dispatch:
#     inputs:
#       issue_id:
#         description: Issue ID to process (can be issue or PR number)
#         required: true
#         type: string
#       command:
#         description: Strands command to execute
#         required: false
#         type: string
#         default: ''
#       session_id:
#         description: Optional session ID to use
#         required: false
#         type: string
#         default: ''

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner to use: 'ubuntu' (GitHub-hosted, default) or 'codebuild' (self-hosted CodeBuild fleet)"
        required: false
        type: string
        default: ubuntu
      issue_id:
        description: Issue ID to process (can be issue or PR number)
        required: true
        type: string
      command:
        description: Strands command to execute
        required: false
        type: string
        default: ''
      session_id:
        description: Optional session ID to use
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  strands-agent:
    # Run only for /strands comments or manual dispatch. github.event_name and
    # github.event.* are inherited from the caller's real triggering event.
    if: startsWith(github.event.comment.body, '/strands') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner == 'codebuild' && format('codebuild-agentcore-e2e-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    steps:
      - name: Fetch secrets from Secrets Manager
        uses: aws/agentcore-devx-devtools/.github/actions/fetch-secrets@31aa3b031a86664e29861d68956e44b07cf21a74
        with:
          role-arn: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
          repo: AWS_ROLE_ARN, AGENT_SESSIONS_BUCKET
      # Comment triggers must come from a collaborator with write access; manual
      # workflow_dispatch runs are trusted and skip the check.
      - name: Check authorization
        id: authz
        if: github.event_name != 'workflow_dispatch'
        uses: aws/agentcore-devx-devtools/.github/actions/check-collaborator@31aa3b031a86664e29861d68956e44b07cf21a74
        with:
          subject: ${{ github.event.comment.user.login }}
          required-permission: write
      - name: Enforce authorization
        if: github.event_name != 'workflow_dispatch' && steps.authz.outputs.is-authorized != 'true'
        run: |
          echo "❌ User ${{ github.event.comment.user.login }} does not have write access"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # STUB: real workflow adds the `strands-running` label via github-script
      # (addLabels). Label mutation — stubbed here.
      - name: Add strands-running label
        run: |
          echo "ℹ️  (stub) would: addLabels ['strands-running'] to #${{ inputs.issue_id || github.event.issue.number || github.event.pull_request.number }}"

      - name: Process inputs and build prompts
        id: process-inputs
        uses: actions/github-script@v9
        with:
          script: |
            const processInputs = require('./.github/scripts/javascript/process-inputs.cjs');
            const inputs = {
              issue_id: '${{ inputs.issue_id }}',
              command: '${{ inputs.command }}',
              session_id: '${{ inputs.session_id }}'
            };
            await processInputs(context, github, core, inputs);

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # STUB: real workflow runs the devtools-hosted
      # aws/agentcore-devx-devtools/.github/actions/strands-action composite, which runs the
      # Strands agent (paid Bedrock model run) and posts PR comments/reviews. Outward +
      # paid — stubbed here. Secret fetch, auth, checkout, prompt construction, and
      # App-token mint above ran for real.
      - name: Run Strands Agent
        env:
          AWS_ROLE_ARN: ${{ env.AWS_ROLE_ARN }}
          SESSION_ID: ${{ steps.process-inputs.outputs.session_id }}
          S3_SESSION_BUCKET: ${{ env.AGENT_SESSIONS_BUCKET }}
          BRANCH_NAME: ${{ steps.process-inputs.outputs.branch_name }}
        run: |
          echo "ℹ️  (stub) would: run aws/agentcore-devx-devtools/.github/actions/strands-action (Strands agent + post PR comments/reviews)"
          echo "ℹ️  (stub) model=us.anthropic.claude-sonnet-4-5-20250929-v1:0 provider=bedrock region=us-west-2"
          echo "ℹ️  (stub) aws_role_arn=${AWS_ROLE_ARN:+set} session_bucket=${S3_SESSION_BUCKET:+set} branch=${BRANCH_NAME}"

      # STUB: real workflow removes the `strands-running` label via github-script
      # (removeLabel). Label mutation — stubbed here.
      - name: Remove strands-running label
        if: always()
        run: |
          echo "ℹ️  (stub) would: removeLabel 'strands-running' from #${{ inputs.issue_id || github.event.issue.number || github.event.pull_request.number }}"
