# TEST pair for reusable-pr-automerge.yml.
# Mirrors the reusable faithfully: the `resolve-config` job (language detection via
# pyproject/package.json -> required-checks / match-mode / commit-title-prefix profile),
# the shared approval/release-PR `if:` guards on BOTH jobs, the checkout, and
# the "Check CI status" github-script (read-only: lists check runs and computes whether
# every required check passed) all run FOR REAL.
# STUBBED (outward / irreversible only):
#   - "Auto-merge PR": the real step calls github.rest.pulls.merge() (squash-merge of the
#     release PR). Irreversible repo mutation — stubbed here. The eligibility computation
#     (CI status + commit-title construction) still runs for real.
# Safe to fire on a push to feat/caller-workflows.
name: "TEST - pr-automerge"
# caller-on:
#   push:
#     branches:
#     - feat/caller-workflows
#   pull_request_review:
#     types:
#     - submitted

on:
  workflow_call:
    # No inputs: every language-specific value is resolved internally by detecting the project
    # language from the checked-out PR head. Callers invoke with `secrets: inherit` only.

permissions:
  contents: read          # test never merges; reusable uses contents/pull-requests: write
  pull-requests: read

jobs:
  # resolve-config: detect the project language from the checked-out PR head and map it to the
  # matching automerge config (outputs consumed by the auto-merge job). pyproject.toml/setup.py
  # => python profile, package.json => typescript profile; defaults to python if neither found.
  resolve-config:
    name: Resolve repo-specific config
    runs-on: ubuntu-latest
    # Mirror the auto-merge guard so we don't do work for irrelevant reviews. Keep this in
    # sync with the auto-merge job's `if:` below.
    if: |
      github.event.review.state == 'approved' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.base.ref == 'main'
    outputs:
      # JSON array of required status-check names.
      required_checks: ${{ steps.cfg.outputs.required_checks }}
      # 'exact' => check name must equal the configured name; 'includes' => substring match.
      match_mode: ${{ steps.cfg.outputs.match_mode }}
      # Prefix prepended to the version segment when building the squash commit title.
      commit_title_prefix: ${{ steps.cfg.outputs.commit_title_prefix }}
    steps:
      # Checkout is only needed for the filesystem-detection fallback. Fetch a shallow tree.
      - name: Checkout (for language detection)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve config
        id: cfg
        run: |
          set -euo pipefail

          # Required status-check names per language profile. Python check names are exact-matched;
          # TypeScript names are substring-matched (see MATCH_MODE) against the live check runs.
          PY_DEFAULT_CHECKS='["Lint","Test Python 3.10","Test Python 3.11","Test Python 3.12","Test Python 3.13","Build Package"]'
          TS_CHECKS='["Test on Node.js (ubuntu-latest)","Test on Node.js 22.x (multi-platform)","Code Coverage"]'

          REQUIRED_CHECKS=""
          MATCH_MODE=""
          COMMIT_TITLE_PREFIX=""

          # Detect the project language from the checked-out PR head. Python is matched first; a
          # package.json (with no Python manifest) selects TypeScript; neither defaults to Python.
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "Detected Python project (pyproject.toml/setup.py)."
            REQUIRED_CHECKS="$PY_DEFAULT_CHECKS"
            MATCH_MODE="exact"
            COMMIT_TITLE_PREFIX="v"
          elif [ -f package.json ]; then
            echo "Detected TypeScript/Node project (package.json)."
            REQUIRED_CHECKS="$TS_CHECKS"
            MATCH_MODE="includes"
            COMMIT_TITLE_PREFIX=""
          else
            echo "Could not detect language; defaulting to Python profile."
            REQUIRED_CHECKS="$PY_DEFAULT_CHECKS"
            MATCH_MODE="exact"
            COMMIT_TITLE_PREFIX="v"
          fi

          {
            echo "required_checks=$REQUIRED_CHECKS"
            echo "match_mode=$MATCH_MODE"
            echo "commit_title_prefix=$COMMIT_TITLE_PREFIX"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved config:"
          echo "  required_checks=$REQUIRED_CHECKS"
          echo "  match_mode=$MATCH_MODE"
          echo "  commit_title_prefix='$COMMIT_TITLE_PREFIX'"

  # auto-merge: the original per-repo logic, parameterized by resolve-config outputs.
  auto-merge:
    name: Auto-merge Release PRs
    runs-on: ubuntu-latest
    needs: resolve-config
    # Only run when PR is approved and it's a release PR.
    # (Same guard as resolve-config; kept explicit so the job is self-documenting.)
    if: |
      github.event.review.state == 'approved' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.base.ref == 'main'

    steps:
      - name: Check CI status
        id: ci-status
        uses: actions/github-script@v8
        env:
          REQUIRED_CHECKS: ${{ needs.resolve-config.outputs.required_checks }}
          MATCH_MODE: ${{ needs.resolve-config.outputs.match_mode }}
        with:
          script: |
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });

            // Required checks + match mode are resolved per-repo by the resolve-config job.
            const requiredChecks = JSON.parse(process.env.REQUIRED_CHECKS);
            const matchMode = process.env.MATCH_MODE; // 'exact' | 'includes'

            const allPassed = requiredChecks.every(checkName => {
              const check = checkRuns.check_runs.find(run =>
                matchMode === 'includes'
                  ? run.name.includes(checkName)
                  : run.name === checkName
              );
              if (!check) {
                console.log(`Check not found: ${checkName}`);
                return false;
              }
              const passed = check.conclusion === 'success';
              console.log(`${checkName}: ${passed ? '✓' : '✗'} (${check.conclusion})`);
              return passed;
            });

            console.log(`All required checks passed: ${allPassed}`);
            return allPassed;

      # STUB: the real workflow squash-merges the release PR here via
      # github.rest.pulls.merge() (irreversible repo mutation). The commit-title
      # construction from the resolved prefix + release-branch version segment still runs
      # for real; only the merge API call is stubbed.
      - name: Auto-merge PR
        if: steps.ci-status.outputs.result == 'true'
        env:
          COMMIT_TITLE_PREFIX: ${{ needs.resolve-config.outputs.commit_title_prefix }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PREFIX="${COMMIT_TITLE_PREFIX:-}"
          VERSION_SEGMENT="$(echo "$HEAD_REF" | cut -d'/' -f2)"
          echo "ℹ️  (stub) would: github.rest.pulls.merge() squash PR #${PR_NUMBER}"
          echo "ℹ️  (stub) commit_title would be: 'Release ${PREFIX}${VERSION_SEGMENT}'"
          echo "ℹ️  (stub) commit_message: 'Auto-merged by release workflow'"
