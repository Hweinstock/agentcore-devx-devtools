# TEST pair for reusable-agent-restricted.yml.
# Mirrors the reusable faithfully: the FULL workflow_call inputs contract, the secret
# fetch (AUTHORIZED_USERS + AWS_ROLE_ARN), the `github.actor`
# authorization gate, the caller-repo checkout, the GitHub App token mint, and the
# construction of the effective agent-harness config (prompt / provider / model /
# max_tokens / tools / role, with the same historical inline defaults) all run FOR REAL.
# STUBBED (outward / irreversible / paid only):
#   - the `./.github/actions/strands-action` composite RUN. That step invokes the
#     Strands agent (paid model run) with `tools: use_github`, which can comment on /
#     mutate PRs and issues (permissions: pull-requests/issues/contents: write).
#     Outward + paid — stubbed here. Everything wiring it up ran for real.
# Safe to fire on a push to feat/caller-workflows.
name: "TEST - Agent Restricted"
# caller-on:
#   push:
#     branches:
#     - feat/caller-workflows
#   workflow_dispatch:
#     inputs:
#       prompt:
#         description: Prompt for the agent
#         required: true
#         default: What are my active pull requests?
#         type: string
#       system_prompt:
#         description: System prompt
#         required: false
#         type: string
#       provider:
#         description: Provider
#         default: bedrock
#         required: false
#         type: choice
#         options:
#         - bedrock
#         - github
#         - openai
#         - anthropic
#       model:
#         description: Model ID (e.g., us.anthropic.claude-sonnet-4-5-20250929-v1:0)
#         required: false
#         default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
#         type: string
#       max_tokens:
#         description: Maximum tokens for model response
#         required: false
#         default: '10000'
#         type: string
#       tools:
#         description: Tool config (e.g., strands_tools:shell;strands_action:use_github)
#         required: false
#         default: strands_tools:shell;tools:use_github
#         type: string
#       agent_runner:
#         description: Custom agent runner URL
#         required: false
#         type: string

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner to use: 'ubuntu' (GitHub-hosted, default) or 'codebuild' (self-hosted CodeBuild fleet)"
        required: false
        type: string
        default: ubuntu
      prompt:
        description: Prompt for the agent
        required: true
        type: string
        default: "What are my active pull requests?"
      system_prompt:
        description: System prompt
        required: false
        type: string
      provider:
        # options: ["bedrock", "github", "openai", "anthropic"]
        description: Provider
        required: false
        type: string
        default: "bedrock"
      model:
        description: "Model ID (e.g., us.anthropic.claude-sonnet-4-5-20250929-v1:0)"
        required: false
        type: string
        default: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      max_tokens:
        description: Maximum tokens for model response
        required: false
        type: string
        default: "10000"
      tools:
        description: "Tool config (e.g., strands_tools:shell;strands_action:use_github)"
        required: false
        type: string
        default: "strands_tools:shell;tools:use_github"
      agent_runner:
        description: Custom agent runner URL
        required: false
        type: string

permissions:
  id-token: write
  contents: read       # test never writes; reusable uses contents/pull-requests/issues: write for the agent

jobs:
  agent:
    runs-on: ${{ inputs.runner == 'codebuild' && format('codebuild-agentcore-e2e-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    steps:
      - name: Fetch secrets from Secrets Manager
        uses: aws/agentcore-devx-devtools/.github/actions/fetch-secrets@31aa3b031a86664e29861d68956e44b07cf21a74
        with:
          role-arn: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
          repo: AUTHORIZED_USERS, AWS_ROLE_ARN
      - name: Check authorization
        id: authz
        uses: aws/agentcore-devx-devtools/.github/actions/check-authorized-user@31aa3b031a86664e29861d68956e44b07cf21a74
        with:
          subject: ${{ github.actor }}
          authorized-users: ${{ env.AUTHORIZED_USERS }}
      - name: Enforce authorization
        if: steps.authz.outputs.is-authorized != 'true'
        run: |
          echo "❌ User ${{ github.actor }} is NOT authorized"
          exit 1

      # Check out the CALLER repo (not the devtools host) so the agent operates on the consumer's
      # own files in the workspace. The strands-action composite and its runner scripts are NOT
      # taken from here — they're bundled with the centrally-hosted action in the devtools repo.
      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Construct the effective agent-harness config exactly as the reusable resolves it
      # (the same `${{ inputs.X || '<historical default>' }}` fallbacks that are fed to
      # the strands-action composite `with:` block). This is pure computation — no agent
      # is run — so we can assert every knob resolves and the App token and fetched AWS role are wired.
      - name: Build effective agent config
        id: agent-config
        env:
          PROMPT: ${{ inputs.prompt || 'What are my active pull requests?' }}
          PROVIDER: ${{ inputs.provider || 'bedrock' }}
          MODEL: ${{ inputs.model || 'us.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
          MAX_TOKENS: ${{ inputs.max_tokens || '10000' }}
          SYSTEM_PROMPT: ${{ inputs.system_prompt }}
          TOOLS: ${{ inputs.tools || 'strands_tools:shell;tools:use_github' }}
          AGENT_RUNNER: ${{ inputs.agent_runner }}
          AWS_ROLE_ARN: ${{ env.AWS_ROLE_ARN }}
          PAT_TOKEN: ${{ steps.app-token.outputs.token }}
          STRANDS_TOOLS_DIRECTORY: 'true'
        run: |
          set -euo pipefail
          {
            echo "provider=$PROVIDER"
            echo "model=$MODEL"
            echo "max_tokens=$MAX_TOKENS"
            echo "tools=$TOOLS"
            echo "aws_region=us-west-2"
          } >> "$GITHUB_OUTPUT"
          echo "Effective agent config:"
          echo "  prompt        = ${PROMPT}"
          echo "  provider      = ${PROVIDER}"
          echo "  model         = ${MODEL}"
          echo "  max_tokens    = ${MAX_TOKENS}"
          echo "  tools         = ${TOOLS}"
          echo "  system_prompt = ${SYSTEM_PROMPT:-<none>}"
          echo "  agent_runner  = ${AGENT_RUNNER:-<default>}"
          echo "  aws_role_arn  = ${AWS_ROLE_ARN:+set}"
          echo "  pat_token     = ${PAT_TOKEN:+set}"
          echo "  STRANDS_TOOLS_DIRECTORY=${STRANDS_TOOLS_DIRECTORY}"

      # STUB: the real workflow runs the devtools-hosted
      # `aws/agentcore-devx-devtools/.github/actions/strands-action` composite, which invokes
      # the Strands agent (paid model run) with the resolved prompt/model/tools. With
      # `tools: use_github` and pull-requests/issues/contents: write, the agent can post
      # PR/issue comments and mutate repo state. Outward + paid — stubbed here. All config
      # construction above ran for real.
      - name: Run Strands Agent
        env:
          PROMPT: ${{ inputs.prompt || 'What are my active pull requests?' }}
          PROVIDER: ${{ steps.agent-config.outputs.provider }}
          MODEL: ${{ steps.agent-config.outputs.model }}
          TOOLS: ${{ steps.agent-config.outputs.tools }}
          AWS_ROLE_ARN: ${{ env.AWS_ROLE_ARN }}
          PAT_TOKEN: ${{ steps.app-token.outputs.token }}
          STRANDS_TOOLS_DIRECTORY: 'true'
        run: |
          echo "ℹ️  (stub) would: run aws/agentcore-devx-devtools/.github/actions/strands-action (invoke Strands agent, may post/mutate PRs & issues)"
          echo "ℹ️  (stub) provider=${PROVIDER} model=${MODEL} tools=${TOOLS} region=us-west-2"
          echo "ℹ️  (stub) aws_role_arn=${AWS_ROLE_ARN:+set} pat_token=${PAT_TOKEN:+set}"

      - name: Test complete
        run: |
          echo "✅ TEST agent-restricted: caller wired + authorized + secrets/token/config verified for ${{ github.repository }}; agent run stubbed"
