name: Fetch secrets tests

on:
  pull_request:
    paths:
      - .github/actions/fetch-secrets/**
      - .github/workflows/fetch-secrets-tests.yml
  push:
    branches:
      - main
    paths:
      - .github/actions/fetch-secrets/**
      - .github/workflows/fetch-secrets-tests.yml

permissions: {}

jobs:
  test:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node --test .github/actions/fetch-secrets/build-secret-ids.test.js
