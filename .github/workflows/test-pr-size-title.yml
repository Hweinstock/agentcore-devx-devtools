# TEST pair for reusable-pr-size-title.yml — two independent PR-check jobs in one workflow.
#   * label-size        — the changed-file fetch, lockfile/snapshot exclusion, and size-label
#                         COMPUTATION run VERBATIM (read-only). STUBBED (label mutation):
#                         removing size/* labels, creating the label if missing, and applying
#                         it — replaced with console.log inside the same script.
#   * validate-pr-title — the title lint (amannn/action-semantic-pull-request, a status check)
#                         is read-only computation, so NOTHING is stubbed.
# Both jobs are gated to PR events so the dev-branch `push` trick cleanly SKIPS instead of
# erroring on the missing pull_request context; a real pull_request_target exercises both fully.
# Safe to fire on a push to feat/caller-workflows.

name: "TEST - pr-size-title"

# caller-on:
#   push:
#     branches:
#     - feat/caller-workflows
#   pull_request_target:
#     branches:
#     - main
#     - feat/**
#     types:
#     - opened
#     - edited
#     - synchronize
#     - reopened

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner to use: 'ubuntu' (GitHub-hosted, default) or 'codebuild' (self-hosted CodeBuild fleet)"
        required: false
        type: string
        default: ubuntu

permissions:
  contents: read

jobs:
  label-size:
    # The real reusable fires on pull_request_target only, so github.event.pull_request is
    # always present. This TEST stub also carries the dev-branch `push` trick, on which there
    # is NO pull_request context (context.payload.pull_request is undefined). Gate the job to
    # PR events so a push-trick run cleanly SKIPS instead of erroring on `.pull_request.number`;
    # a real pull_request_target still exercises the full sizing logic.
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner == 'codebuild' && format('codebuild-agentcore-e2e-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
    steps:
      - name: Calculate PR size and apply label
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // Fetch file-level stats so we can exclude generated/lock files
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const EXCLUDED = [
              /package-lock\.json$/,
              /yarn\.lock$/,
              /pnpm-lock\.yaml$/,
              /\.snap$/
            ];

            let additions = 0;
            let deletions = 0;
            for (const file of files) {
              if (EXCLUDED.some(re => re.test(file.filename))) continue;
              additions += file.additions;
              deletions += file.deletions;
            }
            const totalChanges = additions + deletions;

            // STUB: real workflow removes existing size/* labels (label mutation).
            // We still list them (read-only) but do not remove.
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: prNumber
            });

            for (const label of labels.data) {
              if (label.name.startsWith('size/')) {
                console.log(`ℹ️  (stub) would: removeLabel ${label.name} from #${prNumber}`);
              }
            }

            // Determine size label
            let sizeLabel;
            if (totalChanges <= 20) sizeLabel = 'size/xs';
            else if (totalChanges <= 100) sizeLabel = 'size/s';
            else if (totalChanges <= 500) sizeLabel = 'size/m';
            else if (totalChanges <= 1000) sizeLabel = 'size/l';
            else sizeLabel = 'size/xl';

            // Ensure the label exists before applying it
            const LABEL_COLORS = {
              'size/xs': '3CBF00',
              'size/s':  '5D9801',
              'size/m':  'FBCA04',
              'size/l':  'E67409',
              'size/xl': 'D93F0B'
            };

            // STUB: real workflow ensures the label exists (createLabel) and then
            // applies it (addLabels). Both are label mutations — stubbed here.
            console.log(`ℹ️  (stub) would: ensure label ${sizeLabel} exists (color ${LABEL_COLORS[sizeLabel]})`);
            console.log(`ℹ️  (stub) would: addLabels [${sizeLabel}] to #${prNumber}`);

            core.info(`PR has ${totalChanges} changed lines (excluding lockfiles/snapshots) → ${sizeLabel}`);

            if (sizeLabel === 'size/xl') {
              core.warning(`PR is large (${totalChanges} lines). Consider splitting into smaller PRs.`);
            }

  validate-pr-title:
    runs-on: ${{ inputs.runner == 'codebuild' && format('codebuild-agentcore-e2e-{0}-{1}', github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    # Only run for pull_request / pull_request_target events inherited from the
    # caller. The semantic-PR action requires PR event context to read the title.
    if: ${{ github.event_name == 'pull_request_target' || github.event_name == 'pull_request' }}
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types aligned with this repo's commit conventions (see AGENTS.md)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Repo convention: lowercase subjects (e.g., "feat: add new command")
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            must start with a lowercase letter.
            Example: "feat: add deploy command"
          # Validate the commit message when a PR has a single commit, since
          # GitHub suggests using it as the merge commit message on squash-merge
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true
          # Skip validation for bot/dependency PRs
          ignoreLabels: |
            bot
            dependencies
